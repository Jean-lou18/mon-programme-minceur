

</body>
</html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Programme Minceur & Historique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.1rem;
            color: #1abc9c;
            margin-top: 0;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
              margin-top: 8px;
          background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 5px 0 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-green {
            background-color: #2ecc71;
        }
        .btn-green:hover {
            background-color: #27ae60;
        }
        .btn-purple {
            background-color: #8e44ad;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .btn-purple:hover {
            background-color: #732d91;
        }
        .result {
            font-weight: bold;
            color: #e67e22;
            margin-top: 5px;
        }
        .history-item {
            background: #fff;
            border-left: 4px solid #8e44ad;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mon Suivi Quotidien</h1>

    <!-- POIDS -->
    <div class="card">
        <h2>Poids du jour</h2>
        <label for="poids">Entrez votre poids (kg) :</label>
        <input type="number" id="poids" step="0.1" value="137" oninput="sauvegarderCourant()">
        <div class="result">Départ : 137 kg</div>
    </div>

    <!-- EAU -->
    <div class="card">
        <h2>Hydratation (Eau)</h2>
        <p>Total bu : <span id="totalEau">0</span> Litres</p>
        <button onclick="ajouterEau(0.25)">+ 0,25 L</button>
        <button onclick="ajouterEau(0.33)">+ 0,33 L</button>
        <button onclick="ajouterEau(0.5)">+ 0,50 L</button>
        <button class="btn-green" onclick="remettreEau()">Remettre à 0</button>
    </div>

    <!-- NUTRITION -->
    <div class="card">
        <h2>Nutrition & Protéines (Cible : 150g / repas)</h2>
        <label>Repas 1 (Matin) :</label>
        <textarea id="repas1" placeholder="Ex: Œufs, fromage blanc..." oninput="sauvegarderCourant()"></textarea>
        
        <label>Repas 2 (Midi) :</label>
        <textarea id="repas2" placeholder="Ex: 150g de poulet, légumes..." oninput="sauvegarderCourant()"></textarea>
        
        <label>Repas 3 (Soir) :</label>
        <textarea id="repas3" placeholder="Ex: 150g de poisson, salade..." oninput="sauvegarderCourant()"></textarea>
        
        <label>Collations / Divers :</label>
        <textarea id="collations" placeholder="En-cas, shaker..." oninput="sauvegarderCourant()"></textarea>
    </div>

    <!-- SPORT ET ACTIVITE -->
    <div class="card">
        <h2>Sport & Activité Physique</h2>
        <label for="pas">Nombre de pas :</label>
        <input type="number" id="pas" placeholder="Ex: 8500" oninput="sauvegarderCourant()">

        <label for="activite">Séance de sport / Activité :</label>
        <textarea id="activite" placeholder="Ex: 45 min de marche, renforcement musculaire..." oninput="sauvegarderCourant()"></textarea>
    </div>

    <!-- BOUTON VALIDATION JOURNEE (BIEN VISIBLE) -->
    <button class="btn-purple" onclick="validerJournee()">🏁 CLÔTURER ET ENREGISTRER LA JOURNÉE</button>

    <!-- HISTORIQUE -->
    <div class="card">
        <h2>Historique de vos journées</h2>
        <div id="listeHistorique">Aucune journée enregistrée pour l'instant.</div>
    </div>

</div>

<script>
    let eauTotale = 0;

    function ajouterEau(val) {
        eauTotale = Math.round((eauTotale + val) * 100) / 100;
        document.getElementById('totalEau').innerText = eauTotale;
        sauvegarderCourant();
    }

    function remettreEau() {
        eauTotale = 0;
        document.getElementById('totalEau').innerText = eauTotale;
        sauvegarderCourant();
    }

    function sauvegarderCourant() {
        const donnees = {
            poids: document.getElementById('poids').value,
            eau: eauTotale,
            repas1: document.getElementById('repas1').value,
            repas2: document.getElementById('repas2').value,
            repas3: document.getElementById('repas3').value,
            collations: document.getElementById('collations').value,
            pas: document.getElementById('pas').value,
            activite: document.getElementById('activite').value
        };
        localStorage.setItem('suiviMinceurCourant', JSON.stringify(donnees));
    }

    function validerJournee() {
        const poids = document.getElementById('poids').value;
        const pas = document.getElementById('pas').value || '0';
        const activite = document.getElementById('activite').value || 'Aucune';
        
        let historique = JSON.parse(localStorage.getItem('suiviHistorique')) || [];
        const numeroJour = historique.length + 1;
        const dateJour = new Date().toLocaleDateString('fr-FR');

        const resumeJournee = {
            titre: `Jour ${numeroJour} (${dateJour})`,
            poids: poids,
            eau: eauTotale,
            pas: pas,
            activite: activite,
            repas1: document.getElementById('repas1').value,
            repas2: document.getElementById('repas2').value,
            repas3: document.getElementById('repas3').value,
            collations: document.getElementById('collations').value
        };

        historique.unshift(resumeJournee);
        localStorage.setItem('suiviHistorique', JSON.stringify(historique));
        
        afficherHistorique();
        alert('Journée clôturée et enregistrée dans l\'historique avec succès !');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function afficherHistorique() {
        let historique = JSON.parse(localStorage.getItem('suiviHistorique')) || [];
        const conteneur = document.getElementById('listeHistorique');
        
        if (historique.length === 0) {
            conteneur.innerHTML = 'Aucune journée enregistrée pour l\'instant.';
            return;
        }

        let html = '';
        historique.forEach(j => {
            html += `<div class="history-item">
                <strong>${j.titre}</strong><br>
                ⚖️ Poids : ${j.poids} kg | 💧 Eau : ${j.eau} L | 👟 Pas : ${j.pas}<br>
                🏋️ Sport : ${j.activite}<br>
                🍽️ <em>Matin :</em> ${j.repas1 || '-'}<br>
                🍽️ <em>Midi :</em> ${j.repas2 || '-'}<br>
                🍽️ <em>Soir :</em> ${j.repas3 || '-'}<br>
                🍎 <em>Collations :</em> ${j.collations || '-'}
            </div>`;
        });
        conteneur.innerHTML = html;
    }

    window.onload = function() {
        const sauvegarde = localStorage.getItem('suiviMinceurCourant');
        if (sauvegarde) {
            const data = JSON.parse(sauvegarde);
            if(data.poids) document.getElementById('poids').value = data.poids;
            if(data.eau) {
                eauTotale = data.eau;
                document.getElementById('totalEau').innerText = eauTotale;
            }
            if(data.repas1) document.getElementById('repas1').value = data.repas1;
            if(data.repas2) document.getElementById('repas2').value = data.repas2;
            if(data.repas3) document.getElementById('repas3').value = data.repas3;
            if(data.collations) document.getElementById('collations').value = data.collations;
            if(data.pas) document.getElementById('pas').value = data.pas;
            if(data.activite) document.getElementById('activite').value = data.activite;
        }
        afficherHistorique();
    };
</script>
